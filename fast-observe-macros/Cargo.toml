[package]
name = "fast-observe-macros"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Proc macros for fast-observe (instrument/all_functions/skip + error!)"
repository = "https://github.com/evanlhatch/fast-observe"
keywords = ["error-handling", "profiling", "macros"]
categories = ["rust-patterns", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
venial = "0.6"

# Dev-only path dep on the parent (serde/serde_derive pattern): expansions
# reference ::fast_observe, so integration tests need it in scope. Dev-deps
# don't create publish cycles.
[dev-dependencies]
fast-observe = { path = "..", features = ["instant"] }
trybuild = "1"
# NOTE: no linkme here ON PURPOSE — error! registrations route through
# fast_observe::__private (the #[linkme(crate = ...)] override); consumers
# need no linkme dep. Do not re-add.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
panic = "deny"
