[workspace]
members = ["fast-observe-macros"]

[package]
name = "fast-observe"
version = "0.1.0"
edition = "2024"
authors = ["evan"]
license = "MIT OR Apache-2.0"
description = "Error faults with causal trees + fastrace-first profiling/log orchestration"
# TODO: set before publishing
# repository = "https://github.com/<org>/fast-observe"
keywords = ["error-handling", "profiling", "logging", "tracing", "observability"]
categories = ["development-tools::debugging", "rust-patterns"]

[features]
default = ["fastrace", "bridge-log"]
# Thread-local Instant span accumulator + timing breakdown (wasm-safe via web-time).
instant = ["dep:humantime", "dep:nu-ansi-term"]
# fastrace spans + logforth fastrace event appender + fastrace trace diagnostic.
# NOTE: forwards `fastrace/enable` — fast-observe is the app-facing
# deployment crate; without `enable` every fastrace span silently no-ops.
# Libraries depending on fast-observe: use `default-features = false` and
# let the binary enable fastrace (fastrace's library-level-tracing rule).
fastrace = [
    "dep:fastrace",
    "fastrace/enable",
    "dep:logforth-append-fastrace",
    "dep:logforth-diagnostic-fastrace",
]
# OpenTelemetry export (fastrace reporter + logforth appender crates re-exported).
otel = ["fastrace", "dep:fastrace-opentelemetry", "dep:logforth-append-opentelemetry"]
# JSON layout for the stdout appender.
json = ["dep:logforth-layout-json"]
# logfmt layout for the stdout appender.
layout-logfmt = ["dep:logforth-layout-logfmt"]
# Google Cloud Logging layout for the stdout appender.
layout-gcl = ["dep:logforth-layout-google-cloud-logging"]
# Plain-text layout re-export (the default text layout is built into logforth;
# this is for custom pipelines).
layout-text = ["dep:logforth-layout-text"]
# Syslog appender (native-only default: unix socket /dev/log; the crate itself
# compiles everywhere — off-unix the toggle warns and skips).
log-syslog = ["dep:logforth-append-syslog"]
# systemd journald appender (unix-only: the crate is an empty stub off-unix,
# so the toggle warns and skips there).
log-journald = ["dep:logforth-append-journald"]
# Async appender composition (background worker thread) for stdout + file.
log-async = ["dep:logforth-append-async"]
# RUST_LOG-style per-module filter (OBSERVE_LOG → RUST_LOG) replacing the fixed
# level filter.
filter-rustlog = ["dep:logforth-filter-rustlog"]
# Task-local diagnostic (per-task diagnostic context) on the dispatch.
diag-task-local = ["dep:logforth-diagnostic-task-local"]
# Rolling file appender (enabled in init() when OBSERVE_LOG_DIR is set).
file = ["dep:logforth-append-file"]
# Re-export the log ↔ logforth bridge for custom logger pipelines.
bridge-log = ["logforth/bridge-log"]
# Re-export fastrace-tracing (tracing spans → fastrace).
bridge-tracing = ["fastrace", "dep:fastrace-tracing"]
# Re-export fastrace-reqwest (trace context propagation over HTTP).
http = ["fastrace", "dep:fastrace-reqwest"]
# Web backend: instant spans + browser-console log appender. Browser-only
# (wasm32-unknown-unknown): on wasm32-wasip3 the console does not exist and
# the wasm-bindgen/web-sys deps are not even pulled (target-gated below), so
# the feature degrades to `instant` spans only.
web = ["instant", "dep:wasm-bindgen", "dep:web-sys"]
# Mirror error_counts through the `metrics` crate facade.
metrics-facade = ["dep:metrics"]
# Tier-2 profiler: puffin (compiled in, runtime-selected via `Backends::PUFFIN`).
profile-with-puffin = ["dep:puffin"]
# Tier-2 profiler: tracy (compiled in, runtime-selected via `Backends::TRACY`).
profile-with-tracy = ["dep:tracy-client"]
# Tier-2 profiler: tracing spans (compiled in, runtime-selected via `Backends::TRACING`).
profile-with-tracing = ["dep:tracing"]
# Tier-2 profiler: superluminal (windows-only, runtime-selected via `Backends::SUPERLUMINAL`).
profile-with-superluminal = ["dep:superluminal-perf"]
# serde Serialize/Deserialize for Diagnostic, Severity, SourceSpan.
serde = ["dep:serde", "camino/serde1"]
# fastrace-futures re-export (Stream tracing; FutureExt is in fastrace core).
int-futures = ["fastrace", "dep:fastrace-futures"]
# Backtrace capture hook (std::backtrace; honors RUST_BACKTRACE).
backtrace = []
# best-effort fastrace flush on process exit (atexit/SIGTERM).
flush-on-exit = ["fastrace", "dep:libc"]
# divan re-export + span-breakdown benchmarking (bench_profiled).
bench = ["instant", "dep:divan"]
# eyre boundary conversion helpers (explicit map_err points).
compat-eyre = ["dep:eyre"]
# error-stack boundary conversion helpers.
compat-error-stack = ["dep:error-stack"]
# tokio JoinError → Fault adapter.
int-tokio = ["dep:tokio"]
# Explicit anyhow ↔ Fault boundary conversions (never implicit From).
anyhow-boundary = ["dep:anyhow"]

[dependencies]
parking_lot = "0.12"
log = { version = "0.4", features = ["kv"] }
logforth = { version = "0.30", features = ["starter-log"] }
documented = "0.10"
strum = { version = "0.26", features = ["derive"] }
derive_more = { version = "1.0", features = ["display"] }
sealed = "0.6"
camino = "1.2"
fs-err = "3.3"
bon = "3"
fast-observe-macros = { path = "fast-observe-macros" }
ariadne = "0.6"
anyhow = { version = "1", optional = true, default-features = false }
humantime = { version = "2.2", optional = true }
nu-ansi-term = { version = "0.50", optional = true }
fastrace = { version = "0.7", optional = true }
logforth-append-fastrace = { version = "0.4", optional = true }
logforth-diagnostic-fastrace = { version = "0.4", optional = true }
fastrace-opentelemetry = { version = "0.18", optional = true }
logforth-append-opentelemetry = { version = "0.4", optional = true }
logforth-layout-json = { version = "0.4", optional = true }
logforth-layout-logfmt = { version = "0.4", optional = true }
logforth-layout-google-cloud-logging = { version = "0.4", optional = true }
logforth-layout-text = { version = "0.4", optional = true }
logforth-append-syslog = { version = "0.4", optional = true }
logforth-append-journald = { version = "0.4", optional = true }
logforth-append-async = { version = "0.4", optional = true }
logforth-filter-rustlog = { version = "0.4", optional = true }
logforth-diagnostic-task-local = { version = "0.4", optional = true }
logforth-append-file = { version = "0.4", optional = true }
fastrace-tracing = { version = "0.1", optional = true }
fastrace-reqwest = { version = "0.3", optional = true }
metrics = { version = "0.24", optional = true }
puffin = { version = "0.20", optional = true }
tracy-client = { version = "0.18", optional = true }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
fastrace-futures = { version = "0.7", optional = true }
divan = { version = "0.1", optional = true }
libc = { version = "0.2", optional = true }
eyre = { version = "0.6", optional = true }
error-stack = { version = "0.5", optional = true }
tokio = { version = "1", optional = true, default-features = false }

[dev-dependencies]
serde_json = "1"
insta = "1"
# Doctests/tests using define_errors! need linkme in scope (non-wasm).
linkme = "0.3"

# Browser-only: wasm-bindgen placeholder imports panic on WASI targets
# (proven by wasmtron's observe-spike on wasm32-wasip3).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", features = ["console"], optional = true }

# Clock split (DESIGN.md §2): web-time on wasm, fastant (TSC) on native.
[target.'cfg(target_family = "wasm")'.dependencies]
web-time = "1.1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
linkme = "0.3"
fastant = "0.1"

[target.'cfg(windows)'.dependencies]
superluminal-perf = { version = "0.4", optional = true }

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"
unconditional_recursion = "deny"
redundant_semicolons = "deny"
unused_must_use = "deny"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
variant_size_differences = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "deny"
dbg_macro = "deny"

# `let _ = mutex.lock()` unlocks instantly — always a bug.
let_underscore_lock = "deny"
# No new #[allow] without reason = "...".
allow_attributes_without_reason = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
# .unwrap_or(f()) should be .unwrap_or_else(|| f()) for non-const fns.
or_fun_call = "warn"
# .clone() on refs / unnecessary clones.
redundant_clone = "warn"
# No silent type narrowing: prefer From/TryFrom over `as`.
cast_lossless = "warn"
# filter_map(|x| x.ok()) → flatten().
manual_flatten = "warn"
# let x = expr; x → expr.
let_and_return = "warn"
redundant_pub_crate = "warn"

[package.metadata.docs.rs]
all-features = true
